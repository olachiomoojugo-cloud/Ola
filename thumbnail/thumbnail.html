<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #050608; font-family: "Inter Display", "Inter", sans-serif; }
  .stage { position: relative; width: 1280px; height: 720px; overflow: hidden;
    background:
      radial-gradient(ellipse 620px 520px at 900px 380px, rgba(232,176,74,.55), rgba(201,138,43,.18) 45%, rgba(0,0,0,0) 72%),
      radial-gradient(ellipse 900px 600px at 200px 700px, rgba(20,28,54,.9), rgba(0,0,0,0) 70%),
      #050608; }
  /* light rays */
  .rays { position: absolute; inset: 0;
    background: repeating-conic-gradient(from 200deg at 900px 380px, rgba(255,214,140,.10) 0deg 3deg, rgba(0,0,0,0) 3deg 11deg);
    -webkit-mask-image: radial-gradient(circle 560px at 900px 380px, #000 0%, transparent 80%);
            mask-image: radial-gradient(circle 560px at 900px 380px, #000 0%, transparent 80%); }
  .grain { position: absolute; inset: 0; opacity: .08;
    background-image: radial-gradient(#fff 0.6px, transparent 0.7px); background-size: 3px 3px; }

  /* left text */
  .left { position: absolute; left: 60px; top: 150px; width: 600px; }
  .time { font-weight: 900; font-size: 168px; line-height: .9; letter-spacing: -5px; color: #fff;
    text-shadow: 0 6px 0 #000, 0 0 40px rgba(0,0,0,.8); }
  .time span { color: #F2C063; }
  .kicker { margin-top: 26px; display: inline-block; background: #F2C063; color: #120c02;
    font-weight: 900; font-size: 50px; letter-spacing: -1px; padding: 8px 20px 10px; border-radius: 10px;
    transform: rotate(-2deg); box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  .sub { margin-top: 28px; color: #fff; font-weight: 800; font-size: 64px; line-height: 1.02; letter-spacing: -1.5px;
    text-shadow: 0 4px 0 #000; }
  .sub em { font-style: normal; color: #F2C063; }

  /* phone */
  .phone { position: absolute; left: 735px; top: 48px; width: 360px; height: 640px; border-radius: 52px;
    background: #0d0e12; border: 10px solid #1b1c22;
    box-shadow: 0 0 0 2px #2c2d35, 0 40px 90px rgba(0,0,0,.85), 0 0 120px rgba(242,192,99,.35);
    transform: rotate(6deg); overflow: hidden; }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background: #000; border-radius: 20px; }
  .status { position: absolute; top: 14px; left: 30px; right: 30px; display: flex; justify-content: space-between; color: #fff; font-weight: 700; font-size: 17px; }
  .header { position: absolute; top: 58px; left: 0; right: 0; text-align: center; padding-bottom: 14px; border-bottom: 1px solid #22232a; }
  .avatar { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 6px;
    background: radial-gradient(circle at 50% 45%, #fff6dc 0%, #F2C063 35%, rgba(201,138,43,.2) 70%, transparent 72%);
    box-shadow: 0 0 30px 10px rgba(242,192,99,.55); }
  .name { color: #fff; font-weight: 800; font-size: 22px; }
  .online { color: #F2C063; font-weight: 600; font-size: 14px; }
  .chat { position: absolute; top: 190px; left: 18px; right: 18px; display: flex; flex-direction: column; gap: 14px; }
  .me { align-self: flex-end; background: #2A2C33; color: #fff; font-weight: 600; font-size: 21px; padding: 12px 16px; border-radius: 20px 20px 6px 20px; max-width: 85%; }
  .typing { align-self: flex-start; background: #1f2026; border-radius: 20px; padding: 12px 16px; display: flex; gap: 6px; }
  .typing i { width: 9px; height: 9px; border-radius: 50%; background: #F2C063; display: block; opacity: .9; }
</style>
</head>
<body>
<div class="stage">
  <div class="rays"></div>

  <div class="phone">
    <div class="notch"></div>
    <div class="status"><span>2:47</span><span>12% ▮</span></div>
    <div class="header">
      <div class="avatar"></div>
      <div class="name">Father</div>
      <div class="online">Always online</div>
    </div>
    <div class="chat">
      <div class="me">God, what's my purpose? I feel like I'm wasting my life…</div>
      <div class="typing"><i></i><i></i><i></i></div>
    </div>
  </div>

  <!-- the big reply bubble breaks out of the phone -->
  <div style="position:absolute; left:640px; top:420px; transform: rotate(-3deg);">
    <div style="background: linear-gradient(135deg,#FFE3A3 0%,#F2C063 45%,#C98A2B 100%); color:#1A1408; font-weight:900; font-size:64px; letter-spacing:-2px; line-height:1; padding:26px 34px 30px; border-radius:34px 34px 34px 10px; box-shadow: 0 0 0 4px rgba(255,236,190,.6), 0 0 70px 18px rgba(242,192,99,.65), 0 26px 50px rgba(0,0,0,.7); white-space:nowrap;">
      You're not behind.
    </div>
    <div style="margin:10px 0 0 18px; color:#F2C063; font-weight:800; font-size:22px; text-shadow:0 2px 0 #000;">Father · Seen</div>
  </div>

  <div class="left">
    <div class="time">2:47 <span>AM</span></div>
    <div class="kicker">I TEXTED GOD</div>
    <div class="sub">about my <em>purpose</em>…</div>
  </div>

  <div class="grain"></div>
</div>
</body>
</html>
