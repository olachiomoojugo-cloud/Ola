<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #050608; font-family: "Inter Display", "Inter", sans-serif; }
  .stage { position: relative; width: 1280px; height: 720px; overflow: hidden;
    background: url("photo.jpg") center / cover no-repeat; }
  /* darken the left so the text pops, keep her face bright */
  .shade { position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(6,6,8,.88) 0%, rgba(6,6,8,.7) 32%, rgba(6,6,8,.2) 46%, rgba(6,6,8,0) 56%),
      linear-gradient(0deg, rgba(6,6,8,.55) 0%, rgba(6,6,8,0) 30%); }
  /* glow between her hands, like the message is arriving there */
  .glow { position: absolute; left: 470px; top: 280px; width: 520px; height: 320px;
    background: radial-gradient(ellipse at center, rgba(255,214,140,.55), rgba(242,192,99,.15) 45%, transparent 70%);
    mix-blend-mode: screen; }

  .left { position: absolute; left: 56px; top: 54px; }
  .kicker { display: inline-block; background: #F2C063; color: #120c02; font-weight: 900; font-size: 46px;
    letter-spacing: -1px; padding: 6px 18px 9px; border-radius: 10px; transform: rotate(-2deg);
    box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  .q { margin-top: 18px; color: #fff; font-weight: 900; font-size: 104px; line-height: .92; letter-spacing: -4px;
    text-shadow: 0 5px 0 #000, 0 0 30px rgba(0,0,0,.7); }
  .q em { font-style: normal; color: #F2C063; }

  .reply { position: absolute; left: 50px; top: 410px; transform: rotate(-3deg); }
  .bubble { background: linear-gradient(135deg,#FFE3A3 0%,#F2C063 45%,#C98A2B 100%); color:#1A1408;
    font-weight: 900; font-size: 54px; letter-spacing: -2px; line-height: 1; padding: 22px 28px 26px;
    border-radius: 30px 30px 30px 8px; white-space: nowrap;
    box-shadow: 0 0 0 4px rgba(255,236,190,.6), 0 0 60px 14px rgba(242,192,99,.6), 0 22px 44px rgba(0,0,0,.6); }
  .from { margin: 8px 0 0 16px; color: #FFE3A3; font-weight: 800; font-size: 22px; text-shadow: 0 2px 4px #000; }
  .from b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #FFE3A3;
    box-shadow: 0 0 12px 4px rgba(242,192,99,.9); margin-right: 8px; vertical-align: 1px; }
</style>
</head>
<body>
<div class="stage">
  <div class="shade"></div>
  <div class="glow"></div>

  <div class="left">
    <div class="kicker">I ASKED GOD</div>
    <div class="q">What's my<br><em>purpose?</em></div>
  </div>

  <div class="reply">
    <div class="bubble" id="reply">You're not behind.</div>
    <div class="from"><b></b>Father · Seen</div>
  </div>
</div>
<script>
  const t = new URLSearchParams(location.search).get('reply');
  if (t) document.getElementById('reply').textContent = t;
</script>
</body>
</html>
